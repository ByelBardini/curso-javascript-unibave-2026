<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 02 - Alterando a página</title>
  </head>
  <body>
    <h1 id="titulo">Título original</h1>

    <p id="paragrafo">Este é um parágrafo comum.</p>

    <input type="text" id="campo" placeholder="Digite um novo título" />

    <button onclick="trocaTexto()">Trocar o texto do título</button>
    <button onclick="trocaCor()">Trocar a cor do título</button>
    <button onclick="trocaHtml()">Trocar o HTML do parágrafo</button>
    <button onclick="esconde()">Esconder / mostrar o parágrafo</button>
  </body>
  <script src="script.js"></script>
</html>
