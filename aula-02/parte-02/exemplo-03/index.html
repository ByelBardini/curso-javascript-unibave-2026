<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 03 - Eventos</title>
  </head>
  <body>
    <h1>Eventos sem onclick no HTML</h1>

    <button id="botao">Clique aqui</button>
    <p id="contador">Cliques: 0</p>

    <input type="text" id="campo" placeholder="Digite alguma coisa" />
    <p id="espelho">Você digitou: </p>

    <select id="cor">
      <option value="black">Preto</option>
      <option value="red">Vermelho</option>
      <option value="green">Verde</option>
    </select>
    <p id="amostra">Esse texto muda de cor</p>
  </body>
  <script src="script.js"></script>
</html>
