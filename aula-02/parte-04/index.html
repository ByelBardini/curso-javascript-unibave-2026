<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 02 - Validação de cadastro</title>
  </head>
  <body>
    <h1>Cadastro</h1>
    <p>
      Uma função de validação para cada campo. Cada uma devolve a mensagem de
      erro, ou texto vazio quando está tudo certo.
    </p>

    <form id="formulario">
      <p>
        <input type="text" id="nome" placeholder="Seu nome" />
        <span id="erro-nome"></span>
      </p>

      <p>
        <input type="text" id="email" placeholder="Seu e-mail" />
        <span id="erro-email"></span>
      </p>

      <p>
        <input type="password" id="senha" placeholder="Sua senha" />
        <span id="erro-senha"></span>
      </p>

      <button type="submit">Cadastrar</button>
    </form>

    <p id="resultado"></p>
  </body>
  <script src="script.js"></script>
</html>
