<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 02 - Array de objetos na página</title>
  </head>
  <body>
    <h1>Alunos da turma</h1>

    <!-- A lista começa vazia: quem coloca os itens aqui é o JavaScript -->
    <ul id="lista-alunos"></ul>

    <p id="media"></p>

    <h2>Mesma lista, agora em uma tabela com innerHTML</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Nota</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela"></tbody>
    </table>
  </body>
  <script src="script.js"></script>
</html>
