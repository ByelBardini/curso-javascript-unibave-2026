<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 01 - AJAX: buscando um CEP</title>
  </head>
  <body>
    <h1>Buscar CEP</h1>

    <input type="text" id="campo-cep" placeholder="88811500" />
    <button onclick="buscarCep()">Buscar</button>

    <hr />

    <!-- readonly: o usuário não consegue editar, só o JavaScript preenche -->
    <p>Rua: <input type="text" id="campo-rua" readonly /></p>
    <p>Bairro: <input type="text" id="campo-bairro" readonly /></p>
    <p>Cidade: <input type="text" id="campo-cidade" readonly /></p>
    <p>Estado: <input type="text" id="campo-estado" readonly /></p>
  </body>
  <script src="script.js"></script>
</html>
