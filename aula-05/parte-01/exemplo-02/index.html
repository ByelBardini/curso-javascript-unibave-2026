<html lang="pt-br">
  <head>

    <title>Exemplo 02 - AJAX: feriados do ano</title>

  <body>

    <input type="number" id="campo-ano" value="2026" />

    <table border="1">

      <tbody id="tabela-feriados"></tbody>
    </table>

    <p id="total"></p>

  <script src="script.js"></script>
