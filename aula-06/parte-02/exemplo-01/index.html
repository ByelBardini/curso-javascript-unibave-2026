<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 01 - HTML, CSS e JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Exemplo 01: a página feita só com HTML, CSS e JavaScript, sem framework.
      O exemplo 02 é exatamente a mesma página, feita com Angular.

      Aqui o HTML só desenha a estrutura, ele não sabe nada dos dados:

        - todo elemento que o JavaScript precisa ler ou alterar ganha um id,
          para o script.js encontrá-lo com document.getElementById();
        - os textos que mudam (a saudação, o número do contador, a lista)
          começam vazios, quem escreve neles é o script.js.

      No exemplo 02 é o contrário: o próprio HTML diz qual variável mostrar
      e qual função chamar em cada botão, e nenhum elemento precisa de id.
    -->
    <main>
      <h1>Meu painel</h1>
      <p class="subtitulo">Feito com HTML, CSS e JavaScript puro</p>

      <!-- 1. Saudação -->
      <section>
        <h2>Saudação</h2>

        <input type="text" id="campo-nome" placeholder="Digite seu nome" />

        <!-- Vazio de propósito: o script.js escreve aqui com textContent -->
        <p id="saudacao"></p>
      </section>

      <!-- 2. Contador -->
      <section>
        <h2>Contador</h2>

        <p id="valor-contador" class="numero"></p>

        <!-- Os botões não têm onclick: o script.js liga cada um à sua função
             com addEventListener, procurando pelo id -->
        <div class="linha">
          <button id="botao-diminuir">- 1</button>
          <button id="botao-aumentar">+ 1</button>
          <button id="botao-zerar">Zerar</button>
        </div>
      </section>

      <!-- 3. Lista de tarefas -->
      <section>
        <h2>Lista de tarefas</h2>

        <div class="linha">
          <input type="text" id="campo-tarefa" placeholder="Nova tarefa" />
          <button id="botao-adicionar">Adicionar</button>
        </div>

        <!-- Os <li> são criados pelo script.js, um para cada item do array -->
        <ul id="lista-tarefas"></ul>

        <!-- O script.js mostra e esconde este aviso com style.display -->
        <p id="sem-tarefas" class="vazio">Nenhuma tarefa cadastrada.</p>

        <p id="total-tarefas"></p>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
</html>
