<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 02 - Angular</title>
    <!-- Endereço base que o Angular usa para montar os caminhos da aplicação -->
    <base href="/" />
  </head>
  <body>
    <!--
      Compare com o index.html do exemplo 01: o <body> só tem esta tag.

      <app-root> é o componente App (src/app/app.ts). Quando a página abre, o
      Angular desenha o conteúdo do src/app/app.html aqui dentro.

      Também não tem <link rel="stylesheet"> nem <script src="...">: o
      "npm start" junta o CSS e o JavaScript do projeto e acrescenta essas
      tags sozinho.
    -->
    <app-root></app-root>
  </body>
</html>
